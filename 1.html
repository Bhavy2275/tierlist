<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Tier Maker</title>
    <style>
        /* All previous styles remain the same */
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 20px;
            user-select: none;
        }

        .tier-row {
            display: flex;
            align-items: center;
            margin: 10px 0;
            min-height: 120px;
            border: 2px solid #333;
            position: relative;
        }

        .tier-label {
            background-color: #333;
            padding: 10px;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: text;
            position: relative;
            flex-shrink: 0;
        }

        .delete-tier {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 10;
        }

        .tier-label span {
            font-size: 24px;
            font-weight: bold;
        }

        .color-controls {
            position: absolute;
            top: 5px;
            left: 5px;
            display: none;
            gap: 5px;
            z-index: 10;
        }

        .tier-label:hover .color-controls {
            display: flex;
        }

        .color-picker {
            width: 20px;
            height: 20px;
            padding: 0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .clear-all {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
        }

        .image-container {
            position: relative;
            cursor: move;
            flex-shrink: 0;
            border: 2px solid #444;
            background-color: #2a2a2a;
            max-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-image {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-container:hover .remove-image {
            opacity: 1;
        }

        .image-container img {
            max-height: 300px;
            width: auto;
            height: auto;
            max-width: 400px;
            display: block;
        }

        .tier-content {
            flex-grow: 1;
            min-height: 120px;
            border-left: 2px solid #333;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            overflow-x: auto;
            overflow-y: visible;
            position: relative;
        }

        #image-pool {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #333;
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-start;
        }

        .controls {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #333;
        }

        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .dragging {
            opacity: 0.5;
        }

        .drag-over {
            background-color: #444;
        }

        /* ═══════════════════════════════════
           ROOM SYSTEM STYLES
        ═══════════════════════════════════ */

        /* Top bar */
        #room-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-bottom: 2px solid #7b2ff7;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(123,47,247,0.3);
        }

        #room-bar .brand {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #7b2ff7, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .room-btn {
            background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .room-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(123,47,247,0.5);
            background: linear-gradient(135deg, #9b4fff, #7b2ff7);
        }

        .room-btn.danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .room-btn.danger:hover {
            background: linear-gradient(135deg, #ff5a4a, #e74c3c);
            box-shadow: 0 4px 15px rgba(231,76,60,0.5);
        }

        #join-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #join-code-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(123,47,247,0.5);
            border-radius: 8px;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            width: 110px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        #join-code-input::placeholder {
            letter-spacing: 2px;
            font-weight: 400;
            opacity: 0.5;
        }

        #join-code-input:focus {
            border-color: #7b2ff7;
            box-shadow: 0 0 0 2px rgba(123,47,247,0.25);
        }

        #join-name-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            padding: 8px 12px;
            font-size: 13px;
            width: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        #join-name-input:focus {
            border-color: #7b2ff7;
        }

        /* Active room info */
        #room-info {
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #room-code-display {
            background: rgba(123,47,247,0.2);
            border: 1px solid #7b2ff7;
            border-radius: 8px;
            padding: 6px 14px;
            color: #a78bfa;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        #room-code-display:hover {
            background: rgba(123,47,247,0.35);
        }

        #room-code-display .copy-hint {
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0;
            opacity: 0.7;
            display: block;
            text-align: center;
        }

        #users-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-chip {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: chipIn 0.3s ease;
        }

        @keyframes chipIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-chip .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            flex-shrink: 0;
            box-shadow: 0 0 6px #22c55e;
        }

        .user-chip.self .dot { background: #7b2ff7; box-shadow: 0 0 6px #7b2ff7; }
        .user-chip.host-chip .dot { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }

        /* Toast notification */
        #room-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e1e3a;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            border-left: 4px solid #7b2ff7;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            max-width: 360px;
            text-align: center;
            white-space: nowrap;
        }

        #room-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        #room-toast.error {
            border-left-color: #e74c3c;
        }

        #room-toast.success {
            border-left-color: #22c55e;
        }

        /* Sync indicator */
        #sync-indicator {
            font-size: 11px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: auto;
        }

        #sync-indicator.syncing {
            color: #7b2ff7;
        }

        #sync-indicator .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
        }

        #sync-indicator.syncing .sync-dot {
            background: #7b2ff7;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.6); }
        }

        /* Name modal */
        #name-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        #name-modal.show {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(123,47,247,0.5);
            border-radius: 16px;
            padding: 32px;
            width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-box h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
            background: linear-gradient(90deg, #7b2ff7, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-box p {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .modal-box input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(123,47,247,0.4);
            border-radius: 8px;
            color: white;
            padding: 10px 14px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        .modal-box input:focus {
            border-color: #7b2ff7;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-box .modal-actions button {
            flex: 1;
        }

        .modal-box .cancel-btn {
            background: rgba(255,255,255,0.08);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .modal-box .cancel-btn:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }

    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════
         ROOM SYSTEM — TOP BAR
    ═══════════════════════════════════════════════════════ -->
    <div id="room-bar">
        <span class="brand">🎯 TierList</span>

        <!-- Lobby buttons (shown when not in a room) -->
        <div id="lobby-controls">
            <button class="room-btn" onclick="openCreateModal()">➕ Create Room</button>
            <div id="join-form">
                <input id="join-code-input" type="text" maxlength="6" placeholder="ROOM CODE" title="Enter 6-character room code" oninput="this.value=this.value.toUpperCase()">
                <input id="join-name-input" type="text" maxlength="20" placeholder="Your name">
                <button class="room-btn" onclick="joinRoom()">Join Room →</button>
            </div>
        </div>

        <!-- Active room info (shown when in a room) -->
        <div id="room-info">
            <div id="room-code-display" onclick="copyRoomCode()" title="Click to copy room code">
                <span id="active-code">------</span>
                <span class="copy-hint">click to copy</span>
            </div>
            <div id="users-list"></div>
            <button class="room-btn danger" onclick="leaveRoom()">Leave Room</button>
        </div>

        <!-- Sync indicator -->
        <div id="sync-indicator">
            <div class="sync-dot"></div>
            <span id="sync-text">offline</span>
        </div>
    </div>

    <!-- Name modal (for Create Room) -->
    <div id="name-modal">
        <div class="modal-box">
            <h2>Create a Room</h2>
            <p>Choose a display name. Share the room code with friends so they can join!</p>
            <input id="create-name-input" type="text" maxlength="20" placeholder="Your name (e.g. Alex)" autocomplete="off">
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeCreateModal()">Cancel</button>
                <button class="room-btn" onclick="createRoom()">Create →</button>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="room-toast"></div>

    <!-- ═══════════════════════════════ original controls ═══════════════════ -->
    <div class="controls">
        <input type="file" id="image-upload" accept="image/*" multiple="">
        <button class="button" onclick="addTier()">Add New Tier</button>
    </div>

    <div id="image-pool" ondrop="drop(event)" ondragover="allowDrop(event)" class="">
        <h3>Image Pool</h3>
    </div>

    <!-- Socket.io client (loaded from the server) -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ═══════════════════════════════════════════════════════════════════
        //  ROOM SYSTEM — Socket.io Client
        // ═══════════════════════════════════════════════════════════════════
        const socket = io();
        let myName = '';
        let myRoom = null;
        let isApplyingState = false; // prevent feedback loops
        let syncTimeout = null;

        // ── Toast ──────────────────────────────────────────────────────────
        function showToast(msg, type = 'info', duration = 3000) {
            const t = document.getElementById('room-toast');
            t.textContent = msg;
            t.className = type === 'error' ? 'error show' : type === 'success' ? 'success show' : 'show';
            setTimeout(() => { t.className = t.className.replace(' show', ''); }, duration);
        }

        // ── Sync indicator ─────────────────────────────────────────────────
        function setSyncStatus(status) {
            const ind = document.getElementById('sync-indicator');
            const txt = document.getElementById('sync-text');
            if (status === 'syncing') {
                ind.className = 'syncing';
                txt.textContent = 'syncing…';
            } else if (status === 'connected') {
                ind.className = '';
                txt.textContent = `room: ${myRoom}`;
            } else {
                ind.className = '';
                txt.textContent = 'offline';
            }
        }

        // ── Modal helpers ──────────────────────────────────────────────────
        function openCreateModal() {
            document.getElementById('name-modal').classList.add('show');
            setTimeout(() => document.getElementById('create-name-input').focus(), 100);
        }

        function closeCreateModal() {
            document.getElementById('name-modal').classList.remove('show');
        }

        document.getElementById('create-name-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') createRoom();
        });

        document.getElementById('join-code-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') joinRoom();
        });

        // ── Create Room ────────────────────────────────────────────────────
        function createRoom() {
            const nameInput = document.getElementById('create-name-input');
            const name = nameInput.value.trim() || 'Host';
            myName = name;

            socket.emit('createRoom', { name, state: getFullState() }, (res) => {
                if (!res.success) {
                    showToast('Failed to create room', 'error');
                    return;
                }
                myRoom = res.code;
                closeCreateModal();
                activateRoomUI(res.code, res.users);
                showToast(`Room created! Code: ${res.code} — share it!`, 'success', 5000);
            });
        }

        // ── Join Room ──────────────────────────────────────────────────────
        function joinRoom() {
            const code = document.getElementById('join-code-input').value.trim().toUpperCase();
            const name = document.getElementById('join-name-input').value.trim() || 'Guest';

            if (code.length !== 6) {
                showToast('Enter a 6-character room code', 'error');
                return;
            }

            myName = name;
            socket.emit('joinRoom', { code, name }, (res) => {
                if (!res.success) {
                    showToast(`❌ ${res.error}`, 'error');
                    return;
                }
                myRoom = res.code;
                activateRoomUI(res.code, res.users);

                // Apply host's current state
                if (res.state) {
                    applyFullState(res.state);
                    showToast(`Joined room ${res.code} — synced!`, 'success');
                } else {
                    showToast(`Joined room ${res.code}`, 'success');
                }
            });
        }

        // ── Leave Room ─────────────────────────────────────────────────────
        function leaveRoom() {
            if (!myRoom) return;
            socket.emit('leaveRoom');
            myRoom = null;
            myName = '';
            deactivateRoomUI();
            showToast('Left the room', 'info');
        }

        // ── Copy room code to clipboard ────────────────────────────────────
        function copyRoomCode() {
            if (!myRoom) return;
            navigator.clipboard.writeText(myRoom).then(() => {
                showToast(`Copied: ${myRoom}`, 'success', 1500);
            }).catch(() => {
                showToast(`Room code: ${myRoom}`, 'info', 3000);
            });
        }

        // ── Show/hide room UI ──────────────────────────────────────────────
        function activateRoomUI(code, users) {
            document.getElementById('lobby-controls').style.display = 'none';
            const roomInfo = document.getElementById('room-info');
            roomInfo.style.display = 'flex';
            document.getElementById('active-code').textContent = code;
            updateUsersList(users);
            setSyncStatus('connected');
        }

        function deactivateRoomUI() {
            document.getElementById('lobby-controls').style.display = '';
            document.getElementById('room-info').style.display = 'none';
            document.getElementById('join-code-input').value = '';
            setSyncStatus('offline');
        }

        // ── Render users list ──────────────────────────────────────────────
        function updateUsersList(users) {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            users.forEach((u, i) => {
                const chip = document.createElement('div');
                const isSelf = u.name === myName;
                const isFirst = i === 0;
                chip.className = `user-chip ${isSelf ? 'self' : ''} ${isFirst ? 'host-chip' : ''}`;
                chip.innerHTML = `<div class="dot"></div>${u.name}${isFirst ? ' 👑' : ''}${isSelf ? ' (you)' : ''}`;
                list.appendChild(chip);
            });
        }

        // ── State serialisation ────────────────────────────────────────────
        function getFullState() {
            const tiers = [];
            document.querySelectorAll('#tier-list .tier-row').forEach(row => {
                const labelEl = row.querySelector('.tier-label');
                const span = labelEl.querySelector('span');
                const imgs = [];
                row.querySelectorAll('.tier-content .image-container img').forEach(img => {
                    imgs.push({ src: img.src, w: img.style.width, h: img.style.height });
                });
                tiers.push({
                    bg: labelEl.style.backgroundColor,
                    textColor: span ? span.style.color : 'white',
                    label: span ? span.textContent : 'Tier',
                    images: imgs
                });
            });

            const pool = [];
            document.querySelectorAll('#image-pool .image-container img').forEach(img => {
                pool.push({ src: img.src, w: img.style.width, h: img.style.height });
            });

            return { tiers, pool };
        }

        // ── Apply remote state ─────────────────────────────────────────────
        function applyFullState(state) {
            if (isApplyingState) return;
            isApplyingState = true;

            try {
                // Rebuild tier list
                const tierList = document.getElementById('tier-list');
                tierList.innerHTML = '';
                state.tiers.forEach(t => {
                    const row = document.createElement('div');
                    row.className = 'tier-row';

                    const label = document.createElement('div');
                    label.className = 'tier-label';
                    label.setAttribute('onclick', 'makeEditable(this)');
                    label.style.backgroundColor = t.bg || '#333';
                    label.innerHTML = `
                        <button class="delete-tier" onclick="deleteTier(this)">×</button>
                        <div class="color-controls">
                            <input type="color" class="color-picker bg-color" value="#333333" onchange="changeBackgroundColor(this)" title="Background Color">
                            <input type="color" class="color-picker text-color" value="#ffffff" onchange="changeTextColor(this)" title="Text Color">
                        </div>
                        <span style="color:${t.textColor || 'white'}">${t.label}</span>
                    `;

                    const content = document.createElement('div');
                    content.className = 'tier-content';
                    content.setAttribute('ondrop', 'drop(event)');
                    content.setAttribute('ondragover', 'allowDrop(event)');

                    t.images.forEach(imgData => {
                        const c = createImageContainerFromData(imgData);
                        content.appendChild(c);
                    });

                    const clearBtn = document.createElement('button');
                    clearBtn.className = 'clear-all';
                    clearBtn.setAttribute('onclick', 'clearTier(this)');
                    clearBtn.textContent = 'Clear All';
                    content.appendChild(clearBtn);

                    row.appendChild(label);
                    row.appendChild(content);
                    tierList.appendChild(row);
                });

                // Rebuild pool
                const pool = document.getElementById('image-pool');
                pool.querySelectorAll('.image-container').forEach(c => c.remove());
                state.pool.forEach(imgData => {
                    const c = createImageContainerFromData(imgData);
                    pool.appendChild(c);
                });
            } finally {
                isApplyingState = false;
            }
        }

        // helper for applyFullState
        function createImageContainerFromData(imgData) {
            const c = createImageContainer(imgData.src);
            const img = c.querySelector('img');
            img.style.width = imgData.w || 'auto';
            img.style.height = imgData.h || 'auto';
            return c;
        }

        // ── Broadcast state after every change ────────────────────────────
        function broadcastState() {
            if (!myRoom || isApplyingState) return;
            clearTimeout(syncTimeout);
            setSyncStatus('syncing');
            syncTimeout = setTimeout(() => {
                socket.emit('syncState', { state: getFullState() });
                setSyncStatus('connected');
            }, 300); // debounce 300ms
        }

        // ── Socket.io Events ───────────────────────────────────────────────
        socket.on('stateSync', ({ state, from }) => {
            applyFullState(state);
            showToast(`📡 Synced update from ${from || 'teammate'}`, 'info', 1500);
        });

        socket.on('roomUsers', (users) => {
            updateUsersList(users);
        });

        socket.on('userJoined', ({ name }) => {
            showToast(`👋 ${name} joined the room`, 'info', 2500);
        });

        socket.on('userLeft', ({ name }) => {
            showToast(`👋 ${name} left the room`, 'info', 2500);
        });

        socket.on('youAreHost', () => {
            showToast('👑 You are now the host', 'success', 3000);
        });

        socket.on('disconnect', () => {
            if (myRoom) {
                setSyncStatus('offline');
                showToast('⚠️ Disconnected from server', 'error', 4000);
            }
        });

        socket.on('reconnect', () => {
            showToast('Reconnected!', 'success', 2000);
            if (myRoom) setSyncStatus('connected');
        });

        // ═══════════════════════════════════════════════════════════════════
        //  ORIGINAL TIER LIST LOGIC (with sync hooks added)
        // ═══════════════════════════════════════════════════════════════════
        const imageUpload = document.getElementById('image-upload');
        imageUpload.addEventListener('change', handleImageUpload);

        function handleImageUpload(event) {
            const files = event.target.files;
            const imagePool = document.getElementById('image-pool');

            let loaded = 0;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const container = createImageContainer(e.target.result);
                    imagePool.appendChild(container);
                    loaded++;
                    if (loaded === files.length) broadcastState();
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function createImageContainer(src) {
            const container = document.createElement('div');
            container.className = 'image-container';
            container.draggable = true;
            container.addEventListener('dragstart', drag);

            const img = document.createElement('img');
            img.src = src;

            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-image';
            removeBtn.innerHTML = '×';
            removeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                container.remove();
                broadcastState();
            });

            img.onload = function() {
                const aspectRatio = this.naturalWidth / this.naturalHeight;
                if (this.naturalHeight > 300) {
                    this.style.height = '300px';
                    this.style.width = (300 * aspectRatio) + 'px';
                } else {
                    this.style.height = this.naturalHeight + 'px';
                    this.style.width = this.naturalWidth + 'px';
                }
            };

            container.appendChild(img);
            container.appendChild(removeBtn);
            return container;
        }

        function clearTier(button) {
            const tierContent = button.closest('.tier-content');
            const imageContainers = tierContent.querySelectorAll('.image-container');
            const imagePool = document.getElementById('image-pool');

            imageContainers.forEach(container => {
                if (container.classList.contains('image-container')) {
                    const newContainer = createImageContainer(container.querySelector('img').src);
                    imagePool.appendChild(newContainer);
                    container.remove();
                }
            });
            broadcastState();
        }

        function changeBackgroundColor(input) {
            const label = input.closest('.tier-label');
            label.style.backgroundColor = input.value;
            event.stopPropagation();
            broadcastState();
        }

        function changeTextColor(input) {
            const label = input.closest('.tier-label');
            const span = label.querySelector('span');
            span.style.color = input.value;
            event.stopPropagation();
            broadcastState();
        }

        function makeEditable(element) {
            if (event.target.type === 'color') return;

            const span = element.querySelector('span');
            const text = span.textContent;
            const textColor = span.style.color || 'white';

            const input = document.createElement('input');
            input.type = 'text';
            input.value = text;
            input.style.width = '80px';
            input.style.fontSize = '24px';
            input.style.textAlign = 'center';
            input.style.background = 'transparent';
            input.style.color = textColor;
            input.style.border = 'none';

            input.onblur = function() {
                span.textContent = this.value;
                span.style.color = textColor;
                element.replaceChild(span, this);
                broadcastState();
            };

            input.onkeypress = function(e) {
                if (e.key === 'Enter') this.blur();
            };

            element.replaceChild(input, span);
            input.focus();
        }

        function addTier() {
            const tierList = document.getElementById('tier-list');
            const newTier = document.createElement('div');
            newTier.className = 'tier-row';
            newTier.innerHTML = `
                <div class="tier-label" onclick="makeEditable(this)">
                    <button class="delete-tier" onclick="deleteTier(this)">×</button>
                    <div class="color-controls">
                        <input type="color" class="color-picker bg-color" value="#333333" onchange="changeBackgroundColor(this)" title="Background Color">
                        <input type="color" class="color-picker text-color" value="#ffffff" onchange="changeTextColor(this)" title="Text Color">
                    </div>
                    <span>New</span>
                </div>
                <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <button class="clear-all" onclick="clearTier(this)">Clear All</button>
                </div>
            `;
            tierList.appendChild(newTier);
            broadcastState();
        }

        function deleteTier(button) {
            const tierRow = button.closest('.tier-row');
            const images = tierRow.querySelectorAll('.image-container');
            const imagePool = document.getElementById('image-pool');

            images.forEach(container => {
                const newContainer = createImageContainer(container.querySelector('img').src);
                imagePool.appendChild(newContainer);
            });

            tierRow.remove();
            broadcastState();
        }

        function allowDrop(ev) {
            ev.preventDefault();
            const dropTarget = ev.target.closest('.tier-content') || ev.target;
            if (dropTarget.className.includes('tier-content') || dropTarget.id === 'image-pool') {
                dropTarget.classList.add('drag-over');
            }
        }

        function drag(ev) {
            const container = ev.target.closest('.image-container');
            container.classList.add('dragging');
            ev.dataTransfer.setData("text", container.querySelector('img').src);
        }

        function drop(ev) {
            ev.preventDefault();
            const imgSrc = ev.dataTransfer.getData("text");
            const dropTarget = ev.target.closest('.tier-content') || ev.target;

            if (dropTarget.className.includes('tier-content') || dropTarget.id === 'image-pool') {
                const draggedElement = document.querySelector('.dragging');
                if (draggedElement) {
                    draggedElement.remove();
                }

                const newContainer = createImageContainer(imgSrc);

                if (dropTarget.className.includes('tier-content')) {
                    dropTarget.insertBefore(newContainer, dropTarget.firstChild);
                } else {
                    dropTarget.appendChild(newContainer);
                }
                broadcastState();
            }

            document.querySelectorAll('.drag-over').forEach(element => {
                element.classList.remove('drag-over');
            });
        }
    </script>
